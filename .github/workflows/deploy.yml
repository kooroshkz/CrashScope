name: Deploy to GitHub Pages

on:
  schedule:
    # Run every day at 13:00 UTC
    - cron: '0 13 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - web/accident-visualization

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Checkout LFS objects
      run: git lfs pull
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Generate static data
      env:
        TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: |
        python generate_static.py
    
    - name: Update HTML with timestamp
      run: |
        TIMESTAMP=$(TZ='Europe/Amsterdam' date '+%Y-%m-%d %H:%M:%S %Z')
        sed -i "s|<!-- LAST_UPDATE_PLACEHOLDER -->|<span style=\"color: #666; font-size: 14px;\">Last updated: $TIMESTAMP</span>|g" static/index.html
    
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './static'
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
